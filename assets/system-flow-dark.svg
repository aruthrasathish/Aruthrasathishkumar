                         "Liberation Mono", monospace;
          }

          .packet {
            stroke-dasharray: 6 95;
            animation: travel 7s linear infinite;
          }

          .reverse {
            animation-direction: reverse;
            animation-delay: -3s;
          }

          @keyframes travel {
            to {
              stroke-dashoffset: -202;
            }
          }

          @media (prefers-reduced-motion: reduce) {
            .packet {
              animation: none;
              display: none;
            }
          }
        </style>
        
