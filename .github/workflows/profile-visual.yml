name: Build profile banner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_visual.py
      - .github/workflows/profile-visual.yml

permissions:
  contents: write

concurrency:
  group: profile-visual
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate light, dark, and mobile banners
        run: python3 scripts/build_visual.py

      - name: Commit updated banners
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            assets/system-flow-light.svg \
            assets/system-flow-dark.svg \
            assets/system-flow-mobile-light.svg \
            assets/system-flow-mobile-dark.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m 'Update custom profile banner'
          git push origin "HEAD:$DEFAULT_BRANCH"
