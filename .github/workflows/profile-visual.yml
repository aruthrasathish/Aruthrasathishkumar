name: Refresh profile visual

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [main]
    paths:
      - scripts/build_visual.py
      - .github/workflows/profile-visual.yml

permissions:
  contents: write

concurrency:
  group: profile-visual
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Create initial visuals if missing
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            assets/system-flow-light.svg \
            assets/system-flow-dark.svg \
            assets/system-flow-mobile-light.svg \
            assets/system-flow-mobile-dark.svg
          do
            if [ ! -f "$file" ]; then
              python3 scripts/build_visual.py
              break
            fi
          done

      - name: Fetch contribution data and refresh visuals
        id: activity
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/build_visual.py --fetch

      - name: Report unavailable contribution data
        if: steps.activity.outcome == 'failure'
        run: |
          echo "::warning::Contribution refresh failed. Existing visuals are preserved; initial visuals contain no invented activity."

      - name: Commit generated assets
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            assets/system-flow-light.svg \
            assets/system-flow-dark.svg \
            assets/system-flow-mobile-light.svg \
            assets/system-flow-mobile-dark.svg

          if [ -f assets/activity.json ]; then
            git add assets/activity.json
          fi

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m 'Refresh profile visual and contribution snapshot'
          git push origin "HEAD:$DEFAULT_BRANCH"
